<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كورة TV العالمية</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #080c15;
      color: #ffffff;
      padding-bottom: 30px;
    }
    /* المشغل الثابت */
    .player-header {
      position: sticky;
      top: 0;
      z-index: 999;
      background-color: #000000;
      border-bottom: 2px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .player-info-bar {
      background-color: #0f172a;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .channel-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
    }
    .fs-btn {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    /* المحتوى */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px;
    }
    /* أقسام الدول */
    .countries-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 12px 0;
    }
    .countries-scroll::-webkit-scrollbar { display: none; }
    .country-tab {
      background-color: #0f172a;
      color: #cbd5e1;
      border: 1px solid #1e293b;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .country-tab.active {
      background-color: #e11d48;
      color: #ffffff;
      border-color: #f43f5e;
      box-shadow: 0 2px 10px rgba(225, 29, 72, 0.4);
    }
    /* قائمة القنوات */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      margin: 6px 0 12px 0;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .channels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .channel-card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .channel-card:active {
      transform: scale(0.96);
      background-color: #1e293b;
    }
    .channel-icon {
      width: 40px;
      height: 40px;
      background-color: #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .channel-meta {
      overflow: hidden;
    }
    .channel-name {
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-type {
      font-size: 10px;
      color: #64748b;
      margin-top: 3px;
      display: block;
    }
    /* تشغيل خارجي */
    .custom-box {
      margin-top: 18px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
    }
    .custom-input {
      width: 100%;
      background-color: #080c15;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px;
      color: #fff;
      font-size: 11px;
      margin: 8px 0;
      outline: none;
      direction: ltr;
    }
    .custom-btn {
      width: 100%;
      background-color: #e11d48;
      color: #fff;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- المشغل -->
  <div class="player-header">
    <div class="video-box">
      <video id="player" controls playsinline></video>
    </div>
    <div class="player-info-bar">
      <div class="channel-badge">
        <span class="live-dot"></span>
        <span id="playingTitle">اختر قناة لبدء المشاهدة</span>
      </div>
      <button class="fs-btn" onclick="fullscreen()">⛶ ملء الشاشة</button>
    </div>
  </div>

  <div class="container">
    <!-- أزرار الأقسام -->
    <div class="countries-scroll" id="navTabs"></div>

    <div class="section-title">
      <span id="catName">قنوات المغرب</span>
      <span id="catCount" style="color: #e11d48;">6 قنوات</span>
    </div>

    <!-- شبكة القنوات -->
    <div class="channels-grid" id="channelsGrid"></div>

    <!-- مشغل روابط إضافي -->
    <div class="custom-box">
      <div style="font-size: 12px; font-weight: bold;">⚡ تشغيل رابط سيرفر مخصص (M3U8):</div>
      <input type="text" id="streamInput" class="custom-input" placeholder="https://domain.com/live.m3u8">
      <button class="custom-btn" onclick="playCustom()">تشغيل في المشغل فوراً</button>
    </div>
  </div>

  <script>
    const CHANNELS_DATA = {
      morocco: {
        title: "قنوات المغرب",
        flag: "🇲🇦",
        list: [
          { name: "الرياضية Arryadia", type: "رياضة", icon: "⚽", url: "https://live-snrt.ercdn.net/snrt/arryadia/index.m3u8" },
          { name: "الأولى Al Aoula", type: "عامة", icon: "🇲🇦", url: "https://live-snrt.ercdn.net/snrt/aloula/index.m3u8" },
          { name: "قناة 2M دوزيم", type: "منوعات", icon: "📺", url: "https://live.2m.ma/hls/live.m3u8" },
          { name: "المغربية Al Maghribia", type: "أخبار", icon: "📰", url: "https://live-snrt.ercdn.net/snrt/almaghribia/index.m3u8" },
          { name: "تمازيغت Tamazight", type: "ثقافة", icon: "🏔️", url: "https://live-snrt.ercdn.net/snrt/tamazight/index.m3u8" },
          { name: "ميدي 1 Medi1 TV", type: "أخبار", icon: "🌍", url: "https://medi1tv.vedge.infomaniak.com/livecast/medi1tv/manifest.m3u8" }
        ]
      },
      sports: {
        title: "قنوات رياضية عالمية",
        flag: "🏆",
        list: [
          { name: "ريال مدريد TV", type: "أندية كبرى", icon: "👑", url: "https://rmtv.akamaized.net/hls/live/2043154/rmtv-es/master.m3u8" },
          { name: "ريد بول سبورت", type: "رياضات حماسية", icon: "🏎️", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" },
          { name: "دبي الرياضية 1", type: "رياضة عربية", icon: "⚽", url: "https://dmisportslive.akamaized.net/hls/live/2014022/dubaisports1/master.m3u8" },
          { name: "الشارقة الرياضية", type: "رياضة", icon: "🏆", url: "https://shctv.akamaized.net/hls/live/1000965/sharjahsportstv/master.m3u8" }
        ]
      },
      arabic: {
        title: "قنوات العالم العربي",
        flag: "🌍",
        list: [
          { name: "الجزيرة الإخبارية", type: "أخبار", icon: "🎙️", url: "https://live-hls-web-aje.getaj.net/AJE/03.m3u8" },
          { name: "الحدث الإخبارية", type: "أخبار عاجلة", icon: "⚡", url: "https://mbc-live.akamaized.net/hls/live/2034177/hadath/master.m3u8" },
          { name: "العربية Al Arabiya", type: "أخبار", icon: "📡", url: "https://mbc-live.akamaized.net/hls/live/2034176/arabiya/master.m3u8" },
          { name: "بي بي سي عربي", type: "أخبار دولية", icon: "🌐", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_arabic_tv/pc_hd_abr_v2.m3u8" }
        ]
      },
      france: {
        title: "قنوات فرنسا",
        flag: "🇫🇷",
        list: [
          { name: "فرانس 24 (العربية)", type: "أخبار", icon: "🇫🇷", url: "https://static.france24.com/live/F24_AR_HI_HLS/live_tv.m3u8" },
          { name: "France 24 Français", type: "Info", icon: "🗼", url: "https://static.france24.com/live/F24_FR_HI_HLS/live_tv.m3u8" },
          { name: "BFM TV Live", type: "Actualités", icon: "🗞️", url: "https://live.bfmtv.com/hls/live/2039239/BFMTV_HLS/master.m3u8" }
        ]
      },
      spain: {
        title: "قنوات إسبانيا",
        flag: "🇪🇸",
        list: [
          { name: "RTVE 24h España", type: "Noticias", icon: "🇪🇸", url: "https://rtvelivestream.akamaized.net/rtvesec/24h/24h_main.m3u8" },
          { name: "Canal Sur Andalucía", type: "Variedades", icon: "💃", url: "https://directo.canalsur.es/csur-hls/live.m3u8" }
        ]
      }
    };

    let activeCategory = 'morocco';
    let hls = null;

    function renderTabs() {
      const container = document.getElementById('navTabs');
      container.innerHTML = Object.keys(CHANNELS_DATA).map(key => {
        const item = CHANNELS_DATA[key];
        return `<button class="country-tab ${key === activeCategory ? 'active' : ''}" onclick="setCategory('${key}')">${item.flag} ${item.title}</button>`;
      }).join('');
    }

    function setCategory(key) {
      activeCategory = key;
      renderTabs();
      renderChannels();
    }

    function renderChannels() {
      const data = CHANNELS_DATA[activeCategory];
      document.getElementById('catName').innerText = data.title;
      document.getElementById('catCount').innerText = data.list.length + " قنوات";
      
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = data.list.map(ch => `
        <div class="channel-card" onclick="playChannel('${ch.name}', '${ch.url}')">
          <div class="channel-icon">${ch.icon}</div>
          <div class="channel-meta">
            <div class="channel-name">${ch.name}</div>
            <span class="channel-type">${ch.type}</span>
          </div>
        </div>
      `).join('');
    }

    function playChannel(name, url) {
      const video = document.getElementById('player');
      document.getElementById('playingTitle').innerText = name;

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(e => console.log(e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function playCustom() {
      const val = document.getElementById('streamInput').value.trim();
      if (val) playChannel('قناة خارجية', val);
    }

    function fullscreen() {
      const video = document.getElementById('player');
      if (video.requestFullscreen) video.requestFullscreen();
      else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
    }

    window.onload = function() {
      renderTabs();
      renderChannels();
    };
  </script>
</body>
</html>
