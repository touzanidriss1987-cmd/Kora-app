name: Build Kora App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: فحص الكود
        uses: actions/checkout@v4

      - name: إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تجهيز محرك أندرويد وتطبيق كورة القدم
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kora.alfoot",
            "appName": "كورة القدم",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: تجميع وبناء ملف الـ APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف التطبيق الجاهز
        uses: actions/upload-artifact@v4
        with:
          name: Kora-Alfoot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
